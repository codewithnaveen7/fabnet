# Production — pull pre-built images from Docker Hub (no git/build on server).
# Usage: docker compose -f docker-compose.prod.pull.yml pull && up -d

services:
  mysql:
    image: mysql:8
    container_name: fabnet-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fabnet}
      MYSQL_USER: ${MYSQL_USER:-fabnet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5
    container_name: fabnet-phpmyadmin-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    image: ${DOCKER_REGISTRY:-naveen2202}/fabnet-backend:${IMAGE_TAG:-latest}
    container_name: fabnet-backend-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  kdesigns:
    image: ${DOCKER_REGISTRY:-naveen2202}/fabnet-kdesigns:${IMAGE_TAG:-latest}
    container_name: fabnet-kdesigns-prod
    restart: unless-stopped
    ports:
      - "8080:8080"

  frontend:
    image: ${DOCKER_REGISTRY:-naveen2202}/fabnet-frontend:${IMAGE_TAG:-latest}
    container_name: fabnet-frontend-prod
    restart: unless-stopped
    ports:
      - "3001:8080"

volumes:
  mysql_prod_data:
