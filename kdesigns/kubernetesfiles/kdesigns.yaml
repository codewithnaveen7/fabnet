---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: kdesigns
 namespace: ${cluster_namespace}
spec:
 replicas: ${pod_replicas}
 selector:
    matchLabels:
      app: kdesigns
 template:
   metadata:
     labels:
      app: kdesigns
   spec:
     securityContext:
        seccompProfile:
          type: RuntimeDefault  # Set seccompProfile at the pod level
        runAsUser: 101         # Run as user with UID 101
        runAsGroup: 101        # Run as group with GID 101
        fsGroup: 101           # Set fsGroup to 101
        runAsNonRoot: true      # Ensure the container doesn't run as root
     containers:
       - name: kdesigns
         image: ${docker_image}
         imagePullPolicy: Always
         resources:
           requests:
             memory: "64Mi"
             cpu: "250m"
           limits:
             memory: "128Mi"
             cpu: "500m"
         env:
           - name: NODE_ENV
             value: ${cluster_namespace}
           - name: REACT_APP_BASE_API_URL
             valueFrom:
               configMapKeyRef:
                 name: microservices-vault
                 key: REACT_APP_BASE_API_URL
           - name: REACT_APP_ENVIRONMENT
             valueFrom:
               configMapKeyRef:
                 name: microservices-vault
                 key: KX_ENVIRONMENT               
         ports:
           - containerPort: 8080
         securityContext:
          allowPrivilegeEscalation: false  # Prevent privilege escalation for the container
         resources: {}
     restartPolicy: Always
