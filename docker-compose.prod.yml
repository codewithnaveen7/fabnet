services:
  mysql:
    image: mysql:8
    container_name: fabnet-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fabnet}
      MYSQL_USER: ${MYSQL_USER:-fabnet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5
    container_name: fabnet-phpmyadmin-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fabnet-backend-prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy

  kdesigns:
    build:
      context: ./kdesigns
      dockerfile: Dockerfile.compose.prod
    container_name: fabnet-kdesigns-prod
    restart: unless-stopped
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
        REACT_APP_KDESIGNS_REMOTE_ENTRY_URL: ${REACT_APP_KDESIGNS_REMOTE_ENTRY_URL}
    container_name: fabnet-frontend-prod
    restart: unless-stopped
    expose:
      - "8080"

  proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-naveen2202}/fabnet-proxy:${IMAGE_TAG:-latest}
    container_name: fabnet-proxy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:-panel.fabnetsystems.com}
      API_DOMAIN: ${API_DOMAIN:-api.fabnetsystems.com}
      CDN_DOMAIN: ${CDN_DOMAIN:-cdn.fabnetsystems.com}
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
      - kdesigns

  certbot:
    image: certbot/certbot:latest
    container_name: fabnet-certbot
    profiles:
      - certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  mysql_prod_data:
